<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kodeset - عرض المكون</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #111216; }
    </style>
</head>
<body class="text-[#E4E6EB] min-h-screen flex flex-col selection:bg-indigo-500/30">

    <header class="py-4 border-b border-slate-800/40 bg-[#111216] sticky top-0 z-35">
        <div class="container mx-auto px-4 md:px-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-xs bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 px-2.5 py-1 rounded-md" id="comp-category">جاري التحميل...</span>
            </div>
            <span class="text-xl font-black text-white font-mono">Kodeset</span>
        </div>
    </header>

    <main class="flex-1 container mx-auto px-4 md:px-6 py-6 flex flex-col lg:flex-row gap-6">
        <div class="flex-1 bg-[#EAEAEA] rounded-2xl p-6 md:p-8 flex items-center justify-center min-h-[300px] lg:min-h-0 relative shadow-inner overflow-auto">
            <div id="live-preview-box" class="w-full flex justify-center"></div>
        </div>

        <div class="w-full lg:w-[45%] bg-[#16171D] border border-slate-800/80 rounded-2xl flex flex-col overflow-hidden shadow-xl min-h-[400px]">
            <div class="flex border-b border-slate-800/85 bg-[#111216] px-4 gap-1" id="tabs-container" style="direction: ltr;">
                <button id="tab-html-btn" onclick="switchTab('html')" class="px-4 py-3 text-xs font-bold border-b-2 border-indigo-500 text-white transition hidden">HTML</button>
                <button id="tab-css-btn" onclick="switchTab('css')" class="px-4 py-3 text-xs font-semibold text-slate-400 hover:text-white transition hidden">CSS</button>
                <button id="tab-js-btn" onclick="switchTab('js')" class="px-4 py-3 text-xs font-semibold text-slate-400 hover:text-white transition hidden">JS</button>
            </div>

            <div class="flex justify-between items-center bg-[#111216] px-4 py-2.5 border-b border-slate-800/50" style="direction: ltr;">
                <span class="text-[10px] text-slate-500 font-mono tracking-wider" id="code-type-label">HTML CODE</span>
                <button onclick="copyCurrentCode()" class="bg-[#1A1C23] border border-slate-800 hover:bg-indigo-600 hover:text-white text-slate-300 text-xs px-3.5 py-1.5 rounded-lg transition-all flex items-center gap-1.5" id="copy-btn">
                    <span>📋</span> نسخ الكود
                </button>
            </div>

            <pre class="flex-1 p-5 overflow-auto text-left bg-[#0D0E12] font-mono text-xs text-emerald-400 whitespace-pre" id="modal-code" style="direction: ltr;"></pre>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC229nsYy9leoR9nh_Ehai_216X1bUPFbs",
            authDomain: "studio-2342835081-4fd5b.firebaseapp.com",
            projectId: "studio-2342835081-4fd5b",
            storageBucket: "studio-2342835081-4fd5b.firebasestorage.app",
            messagingSenderId: "331082025852",
            appId: "1:331082025852:web:d24f1068950c7192a8b2f9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let activeComponent = null;
        let activeTab = '';

        function getComponentId() {
            const search = window.location.search;
            const matches = search.match(/[?&]id=([^&]+)/);
            return matches ? decodeURIComponent(matches[1]).replace(/&amp;/g, '&') : null;
        }

        const componentId = getComponentId();

        async function getSingleComponent() {
            if (!componentId) {
                document.getElementById('comp-category').innerText = "لم يتم تحديد أي مكون";
                return;
            }
            try {
                const docSnap = await db.collection("components").doc(componentId).get();
                if (docSnap.exists) {
                    activeComponent = docSnap.data();
                    renderComponentPage();
                } else {
                    document.getElementById('comp-category').innerText = "المكون غير موجود";
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderComponentPage() {
            document.getElementById('comp-category').innerText = activeComponent.category || 'مكون';
            const liveBox = document.getElementById('live-preview-box');
            liveBox.innerHTML = `<style>${activeComponent.cssCode || ''}</style><div>${activeComponent.htmlCode || ''}</div>`;
            
            if (activeComponent.jsCode && activeComponent.jsCode.trim() !== '') {
                const script = document.createElement('script');
                script.text = `(function(){ ${activeComponent.jsCode} })();`;
                liveBox.appendChild(script);
            }

            const htmlBtn = document.getElementById('tab-html-btn');
            const cssBtn = document.getElementById('tab-css-btn');
            const jsBtn = document.getElementById('tab-js-btn');
            let defaultTab = '';

            // تفعيل الأزرار فقط إذا كانت الأكواد مرفوعة وموجودة
            if (activeComponent.htmlCode && activeComponent.htmlCode.trim() !== '') {
                htmlBtn.classList.remove('hidden');
                if (!defaultTab) defaultTab = 'html';
            }
            if (activeComponent.cssCode && activeComponent.cssCode.trim() !== '') {
                cssBtn.classList.remove('hidden');
                if (!defaultTab) defaultTab = 'css';
            }
            if (activeComponent.jsCode && activeComponent.jsCode.trim() !== '') {
                jsBtn.classList.remove('hidden');
                if (!defaultTab) defaultTab = 'js';
            }

            if (defaultTab) { switchTab(defaultTab); } 
            else { document.getElementById('modal-code').textContent = '// لا توجد أكواد برمجية.'; }
        }

        window.switchTab = function(tab) {
            activeTab = tab;
            const htmlBtn = document.getElementById('tab-html-btn');
            const cssBtn = document.getElementById('tab-css-btn');
            const jsBtn = document.getElementById('tab-js-btn');
            const codeBox = document.getElementById('modal-code');
            const label = document.getElementById('code-type-label');

            [htmlBtn, cssBtn, jsBtn].forEach(btn => btn.className = "px-4 py-3 text-xs font-semibold text-slate-400 hover:text-white transition");

            if (tab === 'html') {
                htmlBtn.className = "px-4 py-3 text-xs font-bold border-b-2 border-indigo-500 text-white transition";
                codeBox.textContent = activeComponent.htmlCode || '';
                label.innerText = 'HTML CODE';
            } else if (tab === 'css') {
                cssBtn.className = "px-4 py-3 text-xs font-bold border-b-2 border-indigo-500 text-white transition";
                codeBox.textContent = activeComponent.cssCode || '';
                label.innerText = 'CSS CODE';
            } else if (tab === 'js') {
                jsBtn.className = "px-4 py-3 text-xs font-bold border-b-2 border-indigo-500 text-white transition";
                codeBox.textContent = activeComponent.jsCode || '';
                label.innerText = 'JS CODE';
            }
        };

        window.copyCurrentCode = function() {
            let codeToCopy = '';
            if (activeTab === 'html') codeToCopy = activeComponent.htmlCode
